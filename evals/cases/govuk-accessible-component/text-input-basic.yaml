id: text-input-basic
skill: govuk-accessible-component
prompt: >-
  Build an accessible GOV.UK Design System text input for a user's full name.
  Include a visible label and a hint. Return the component markup plus a short
  note of the accessibility features you implemented.
must_contain:
  - full-name
  - aria-describedby
  - label
must_not_contain:
  - "outline: none"
